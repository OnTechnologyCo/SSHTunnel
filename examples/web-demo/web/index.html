<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>OnTech 터널 연결 테스트</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><span class="brand">ONTECH / TUNNEL TEST</span><span id="badge" class="badge">확인 중</span></header><h1>터널이 연결되었습니다.</h1><p class="intro">이 페이지는 터널 뒤에 있는 테스트 서버가 보내는 화면입니다.<br>메시지를 보내 양방향 통신을 직접 확인해 보세요.</p><section class="address"><small>현재 접속한 터널 주소</small><strong id="address">—</strong></section><div class="stats"><section><small>왕복 응답 시간</small><strong id="latency">—</strong></section><section><small>서버 현재 시각</small><strong id="clock">—</strong></section></div><section class="card"><h2>메시지 왕복 테스트</h2><form id="echo-form"><label for="message">서버로 보낼 메시지</label><textarea id="message" maxlength="500" rows="3">안녕하세요! 터널 통신 테스트입니다.</textarea><button id="send" type="submit">메시지 보내기 <span>→</span></button></form><div id="reply" class="reply" role="status" aria-live="polite">메시지를 보내면 서버 응답이 여기에 표시됩니다.</div></section><footer>브라우저 → 공개 터널 주소 → SSH 터널 → 테스트 서버<br><span id="checked">연결 상태를 확인하고 있습니다.</span><p>통신 확인용 테스트 페이지입니다. 비밀번호나 개인정보를 입력하지 마세요.</p></footer></main></body></html>
