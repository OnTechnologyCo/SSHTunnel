name: Go security and compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Test and build server and SDK clients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOTOOLCHAIN = 'go' + (Get-Content .go-version -Raw).Trim()
          go test -v -count=1 -timeout 120s ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Vet failed' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Check reachable vulnerabilities
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = 'go' + (Get-Content .go-version -Raw).Trim()
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          if ($LASTEXITCODE -ne 0) { throw 'Scanner install failed' }
          govulncheck -scan=symbol ./...
          if ($LASTEXITCODE -ne 0) { throw 'Vulnerability scan failed' }
